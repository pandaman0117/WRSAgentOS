[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wrs-agent"
version = "0.1.0"
description = "Interruptible robot runtime with explicit execution authority"
requires-python = ">=3.12,<3.13"
dependencies = ["eclipse-zenoh==1.9.0", "pydantic>=2.12,<3"]

[project.optional-dependencies]
glm = ["httpx>=0.28,<0.29"]

[dependency-groups]
dev = ["httpx>=0.28,<0.29", "pytest>=9,<10", "pytest-asyncio>=1,<2", "ruff>=0.15,<1"]

[tool.setuptools.packages.find]
include = ["wrs_agent*"]

[tool.setuptools.package-data]
"wrs_agent.skills" = ["README.md", "*/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers"
markers = ["zenoh: real multi-process Zenoh", "wrs: WRS virtual model", "live_model: paid model opt-in", "audio_live: real microphone", "hardware: supervised hardware only"]
norecursedirs = ["third_party", ".local", ".references"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["third_party", ".local", ".references"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"wrs_agent/transport.py" = ["ASYNC109"]
"tests/conftest.py" = ["ASYNC109"]
