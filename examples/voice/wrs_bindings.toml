# launch() starts enabled nodes; skills bind to explicit node IDs.
# Python still owns process supervision, endpoint selection, and credentials.
[nodes.wrs]
type = "wrs"
suffix = ""
actions = true
enabled = true

[nodes.tts]
type = "tts"
suffix = "-tts"
actions = true
enabled = true

[nodes.agent]
type = "agent"
suffix = ""
actions = false
enabled = true

[nodes.voice]
type = "voice"
suffix = "-voice"
actions = false
enabled = true

# Holds the microphone only while a button is pressed; transcripts go back to that caller.
[nodes.asr]
type = "asr"
suffix = "-asr"
actions = false
enabled = true

[skills]
observe = "wrs"
move_named_pose = "wrs"
move_relative = "wrs"
set_gripper = "wrs"
speak = "tts"
