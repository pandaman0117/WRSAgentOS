# launch() starts enabled nodes; skill routes are discovered from these nodes.
# Python still owns process supervision, endpoint selection, and credentials.
[nodes.wrs]
type = "wrs"
suffix = ""
actions = true
enabled = true

[nodes.tts]
type = "tts"
suffix = "-tts"
actions = true
enabled = true

[nodes.agent]
type = "agent"
suffix = ""
actions = false
enabled = true

[nodes.voice]
type = "voice"
suffix = "-voice"
actions = false
enabled = true

# Declaration only: there is no Vision process or fabricated observation.
[nodes.vision]
type = "vision"
suffix = "-vision"
actions = false
enabled = false
